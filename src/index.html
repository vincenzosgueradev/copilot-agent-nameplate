<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Nameplate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <img class="header-logo" src="./logo-color.svg" alt="" width="22" height="22">
            <span class="header-title">Agent Nameplate</span>
            <span class="header-version" id="app-version"></span>
        </div>
        <div class="header-right">
            <div id="connection-badge" class="connection-badge connection-badge--loading">
                <span class="connection-dot"></span>
                <span id="connection-name">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- Main layout: 3 zones -->
    <div class="app-layout">

        <!-- CENTER: Step content -->
        <main class="main-content" id="main-content">
            <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb" hidden></nav>
            <div class="solutions-browser" id="welcome-screen">
                <div class="hero">
                    <span class="hero-mark">
                        <span class="icon icon-layers" aria-hidden="true"></span>
                    </span>
                    <div class="hero-text">
                        <h2 class="hero-title">Solutions</h2>
                        <p class="browser-subtitle" id="browser-subtitle">
                            Solutions containing agents. Select one to see its agents.
                        </p>
                    </div>
                    <dl class="hero-stats" id="hero-stats"></dl>
                </div>

                <div class="solutions-browser-header">
                    <div class="header-actions">
                        <div class="segmented" id="solution-type-filter" role="group"
                            aria-label="Solution type"></div>
                        <div class="search-box">
                            <span class="icon icon-search icon--sm search-icon" aria-hidden="true"></span>
                            <input id="solution-search" type="text" autocomplete="off"
                                placeholder="Search solutions and agents...">
                            <button id="clear-search-btn" class="search-clear"
                                title="Clear search" hidden><span class="icon icon-close icon--xs" aria-hidden="true"></span></button>
                        </div>
                        <span class="refresh-indicator" role="status">
                            <span class="spinner"></span> Updating…
                        </span>
                        <button id="history-btn" class="btn btn--secondary btn--sm"
                            title="Packaging history"><span class="icon icon-history icon--sm" aria-hidden="true"></span> History</button>
                        <button id="refresh-solutions-btn" class="btn btn--secondary btn--sm"
                            title="Reload solutions and agents" disabled><span class="icon icon-refresh icon--sm" aria-hidden="true"></span> Refresh</button>
                    </div>
                </div>
                <div id="solutions-table-container"></div>
            </div>

            <!-- Step content areas (hidden by default) -->
            <div id="step-solution" class="step-panel" style="display:none"></div>
            <div id="step-suffix" class="step-panel" style="display:none"></div>
            <div id="step-review" class="step-panel" style="display:none"></div>
            <div id="step-preview" class="step-panel" style="display:none"></div>
            <div id="step-verify" class="step-panel" style="display:none"></div>
            <div id="step-result" class="step-panel" style="display:none"></div>
            <div id="step-history" class="step-panel" style="display:none"></div>
        </main>

        <!-- RIGHT: Log Panel -->
        <aside class="sidebar-right" id="log-panel">
            <div class="sidebar-header">
                <span class="sidebar-title">Log</span>
                <div class="sidebar-tools">
                    <button id="clear-log-btn" class="icon-btn" title="Clear log"><span class="icon icon-close icon--xs" aria-hidden="true"></span></button>
                    <button id="toggle-log-btn" class="icon-btn" title="Collapse log"
                        aria-expanded="true" aria-controls="log-panel"><span class="icon icon-chevron-right icon--sm" aria-hidden="true"></span></button>
                </div>
            </div>
            <div id="log-entries" class="log-entries"></div>
            <div class="log-footer">
                <button id="export-log-btn" class="btn btn--secondary btn--sm" disabled>Export</button>
            </div>
        </aside>

    </div>

    <!-- Confirmation Dialog (hidden by default) -->
    <div id="confirm-overlay" class="overlay" style="display:none">
        <div class="dialog">
            <div class="dialog-header">
                <h3 id="confirm-title">Confirm</h3>
            </div>
            <div class="dialog-body" id="confirm-body"></div>
            <div class="dialog-footer">
                <button id="confirm-cancel-btn" class="btn btn--secondary">Cancel</button>
                <button id="confirm-ok-btn" class="btn btn--primary">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.ts"></script>
</body>
</html>
